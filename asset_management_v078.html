async function saveRepair(e,id=''){e.preventDefault();if(!canModify())return alert('僅 Owner / Editor 可以修改維修紀錄');const f=Object.fromEntries(new FormData(e.target));f.terminal=f.terminal==='其他'?(f.terminalOther.trim()||'其他'):f.terminal;delete f.terminalOther;if(!f.date||!f.reporter?.trim()||!f.reason?.trim()||!(f.assetId||f.propertyNo?.trim()||f.serialNo?.trim()||f.deviceName?.trim()))return alert('請填寫日期、設備識別資訊、報修人員及送修原因');if(!f.deviceName||!f.brandModel||!catalogPairs().get(f.deviceName)?.has(f.brandModel))return alert('設備名稱及廠牌型號必須選擇現有或已核准的組合');if(e.target.dataset.busy==='1')return;const finish=window.beginFormBusy(e.target,'正在儲存維修紀錄與異動歷程…');try{await window.cloudSaveRepair(f,id);closeModal();render()}catch(err){alert('維修紀錄儲存失敗：'+err.message)}finally{finish()}}

function saveHandover(e,id){if(denyViewer())return;e.preventDefault();let h=handovers.find(x=>x.id===id),before=h?{...h}:null,d=Object.fromEntries(new FormData(e.target));if(!d.title.trim()||!d.content.trim()){alert('請填寫標題與內容');return}if(!h){h={id:'HND-'+Date.now(),createdAt:now(),history:[]};handovers.unshift(h)}Object.assign(h,{title:d.title.trim(),content:d.content.trim(),status:d.status,updatedAt:now()});h.history.push({date:now(),actor:'展示管理員',before,after:{title:h.title,content:h.content,status:h.status}});workLog(before?'修改工作交接':'新增工作交接',h,before);closeModal();render()}
function changeHandoverStatus(id,status){if(denyViewer())return;let h=handovers.find(x=>x.id===id);if(!h||h.status===status)return;let before={...h};h.status=status;h.updatedAt=now();h.history.push({date:now(),actor:'展示管理員',before:{status:before.status},after:{status}});workLog('更新交接狀態',h,before);render()}
function showHandoverHistory(id){let h=handovers.find(x=>x.id===id);if(!h)return;showModal('交接修改歷程',`<div class="sectionhint">${esc(h.title)} · 每次修改均保留紀錄</div>${(h.history||[]).slice().reverse().map(x=>`<div class="logitem"><div class="muted">${esc(x.date)} · ${esc(x.actor)}</div><details><summary style="cursor:pointer;margin-top:6px">檢視修改前後</summary><p class="muted">修改前</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(x.before||{},null,2))}</pre><p class="muted">修改後</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(x.after,null,2))}</pre></details></div>`).join('')}`)}

function sortRepairOverview(key){
 if(repairOverviewSortKey===key)repairOverviewSortDirection=repairOverviewSortDirection==='asc'?'desc':'asc';
 else{repairOverviewSortKey=key;repairOverviewSortDirection=['type','model'].includes(key)?'asc':'desc'}
 render();
}
function sortedRepairModels(models){
 const key=repairOverviewSortKey,dir=repairOverviewSortDirection==='asc'?1:-1;
 return [...models].sort((a,b)=>{
  const x=a[key],y=b[key];
  const n=['total','repaired','visits','rate'].includes(key)?Number(x)-Number(y):String(x??'').localeCompare(String(y??''),'zh-Hant',{numeric:true,sensitivity:'base'});
  return n*dir||String(a.type).localeCompare(String(b.type),'zh-Hant')||String(a.model).localeCompare(String(b.model),'zh-Hant');
 });
}
function repairSortHeader(key,label){

function importDate(v){if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v))return [v.getFullYear(),String(v.getMonth()+1).padStart(2,'0'),String(v.getDate()).padStart(2,'0')].join('-');if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v*86400000));return Number.isFinite(d.getTime())?d.toISOString().slice(0,10):'';}const t=String(v).trim();if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(t))return t.slice(0,10).replace(/\//g,'-');return t;}

async function analyzeExcelImport(){

 excelImportBusy=true;excelImportRows=[];excelImportWarnings=[];excelImportStats=[];
 try{
  const seen=new Set();let matched=0;
  for(const file of files){if(!/\.xlsx$/i.test(file.name))throw new Error('只接受 .xlsx：'+file.name);
   const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,raw:true});
   const fileType=/client端/i.test(file.name)?'client':/機房內/.test(file.name)?'server':null;
   if(!fileType)throw new Error('請選取指定的 2026 Client／機房內資產調查表：'+file.name);
   for(const sheetName of wb.SheetNames){
    const type=fileType==='client'&&IMPORT_CLIENT_SHEETS.has(sheetName)?'client':fileType==='server'&&IMPORT_SERVER_SHEETS.has(sheetName)?'server':null;
    if(!type)continue;matched++;
    const ws=wb.Sheets[sheetName],matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:true});
    const header=matrix[2]||[];
    const normalized=x=>String(x??'').replace(/\s+/g,'').toLowerCase();
    const findColumn=(names)=>header.findIndex(h=>names.some(n=>normalized(h)===normalized(n)));
    const column=(row,names)=>{const i=findColumn(names);return i<0?'':importCell(row,i)};
    const required=type==='client'?[['財產編號'],['設備名稱'],['廠牌型號']]:[['財產編號'],['序號'],['設備名稱'],['廠牌型號']];
    if(required.some(names=>findColumn(names)<0))throw new Error(`工作表「${sheetName}」第 3 列欄位不符合 2026 資產調查表`);
    let count=0;
    for(let i=3;i<matrix.length;i++){
     const row=matrix[i]||[],c=names=>column(row,names);
     const device=c(['設備名稱']),model=c(['廠牌型號']),property=c(['財產編號']);
     const serial=type==='server'?c(['序號']):'';
     if(!device&&!model&&!property&&!serial)continue;
     if(!device){excelImportWarnings.push(`${sheetName} 第 ${i+1} 列沒有設備名稱，已略過`);continue;}
     const remark=c(['備註','備註1','備註 1']);
     const a=type==='client'?{type,team:sheetName,propertyNo:property,serialNo:'',deviceType:device,model,ipAddress:c(['IP Address','IPAddress']),macAddress:c(['MAC Address','MACAddress']),user:c(['使用者']),custodian:c(['保管人']),location:c(['地點']),notes:remark,notes1:remark,notes2:'',notes3:'',contract:'',isMaintenance:'',lastInventory:'',lastEditor:''}:
      {type,team:sheetName,propertyNo:property,serialNo:serial,deviceType:device,model,contract:c(['保單名稱']),ipAddress:c(['IP Address(Server) or Manage']),macAddress:c(['MAC Address(Server)']),custodian:c(['保管人']),isMaintenance:importMaint(c(['是否為本案維護標的','是否為本案大同維護標的'])),location:c(['地點']),cabinet:c(['機櫃']),uSpace:c(['U數']),direction:c(['安裝方向']),project:c(['原專案名稱']),notes:remark,notes1:remark,notes2:'',notes3:'',lastInventory:'',lastEditor:''};
     a.sourceRow=i+1;a.sourceSheet=sheetName;a.sourceFile=file.name;a.id=crypto.randomUUID();
     const key=[a.type,a.team,a.propertyNo].join('|');
     if(a.propertyNo){if(seen.has(key))excelImportWarnings.push(`${sheetName} 第 ${i+1} 列財編 ${a.propertyNo} 在匯入檔內重複（允許匯入，將建立不同隱藏 ID）`);seen.add(key)}
     excelImportRows.push(a);count++;
    }
    excelImportStats.push({name:sheetName,count});
   }
  }
  if(!matched)throw new Error('未找到符合 Client 或 Server 正式清冊的工作表');
  if(!excelImportRows.length)throw new Error('找不到可匯入的財產資料');
  render();const p=$('importProgress');if(p)p.textContent='已完成分析，尚未寫入資料庫。';
 }catch(e){excelImportRows=[];alert('Excel 分析失敗：'+e.message)}finally{excelImportBusy=false}
}

function auditActor(l){const profile=adminProfiles[l.actorUid];return l.actorDisplayName||profile?.displayName||l.actorEmail||l.actorUid||'未知人員'}
const AUDIT_LABELS={date:'日期',status:'維修狀態',reason:'送修原因',reporter:'報修人員',shipper:'送修人員',receiver:'收件人員',shipDate:'送修日期',receiveDate:'收件日期',deviceName:'設備名稱',brandModel:'廠牌型號',terminal:'航廈',repairLocation:'報修位置',replacement:'更換設備名稱財編',serialNo:'設備序號',assetId:'關聯財產',propertyNo:'財產編號',type:'設備分類',deviceType:'設備類型',model:'型號',team:'單位',ipAddress:'IP 位址',location:'位置',lastInventory:'盤點日期',serialNo:'序號',macAddress:'MAC 位址',custodian:'保管人',user:'使用者',contract:'維護合約',isMaintenance:'維護狀態',notes:'備註'};
const AUDIT_HIDDEN=new Set(['id','createdAt','updatedAt','createdBy','updatedBy','createdByEmail','createdByName']);
function auditProperty(l){const r=l.after||l.before||{};const a=assets.find(x=>x.id===(r.assetId||l.assetId));return r.propertyNo||a?.propertyNo||r.deviceName||'無財編'}
function auditTime(l){return l.timestamp?new Date(l.timestamp).toLocaleString('zh-TW',{hour12:false}):'時間未提供'}
function auditValue(v){if(v===null||v===undefined||v==='')return '—';if(typeof v==='boolean')return v?'是':'否';if(typeof v==='object')return JSON.stringify(v);return String(v)}
function auditChanges(l){
 const before=l.before&&typeof l.before==='object'?l.before:{};
 const after=l.after&&typeof l.after==='object'?l.after:{};
 const created=!l.before;
 const keys=[...new Set([...Object.keys(before),...Object.keys(after)])].filter(k=>!AUDIT_HIDDEN.has(k)&&k!=='assetId');
 return keys.filter(k=>created?after[k]!==''&&after[k]!=null:JSON.stringify(before[k]??null)!==JSON.stringify(after[k]??null)).map(k=>({label:AUDIT_LABELS[k]||k,old:created?'—':auditValue(before[k]),next:auditValue(after[k])}));
}
function auditSummary(l){
 if(l._auditType==='維修'&&(l.action==='刪除維修紀錄'||l.after===null)){const r=l.before||{};return '已刪除送修紀錄 · '+(r.deviceName||'設備')+' · '+(r.reason||'未填原因')+' · '+(r.date||'');}

 const changes=auditChanges(l);
 if(!changes.length)return '未偵測到欄位內容差異';
 const first=changes.slice(0,2).map(c=>`${c.label}：${c.old} → ${c.next}`).join('；');

function auditSnapshotRows(record){

 return Object.entries(record).filter(([k,v])=>!AUDIT_HIDDEN.has(k)&&k!=='assetId'&&v!==null&&v!==undefined&&v!=='')

function cloudHistoryPage(){

 (entries.length?entries.map(l=>{
  const operation=auditOperation(l);

  const summary=operation==='create'?'查看新增紀錄內容':operation==='delete'?'查看刪除紀錄內容':'查看修改欄位（'+rows.length+' 項）';
  const body=isSnapshot?
   `<table><thead><tr><th>欄位</th><th>${operation==='create'?'新增內容':'刪除前內容'}</th></tr></thead><tbody>${rows.map(c=>`<tr><td><strong>${esc(c.label)}</strong></td><td style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(c.value)}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">沒有可顯示的紀錄內容</td></tr>'}</tbody></table>`:

  return `<div class="logitem" data-history-key="${esc(l._auditKey)}"><div class="flex"><strong>${esc(l._auditType)} · ${esc(l.action||'異動')}</strong><span class="tag">${esc(auditProperty(l))}</span></div><div class="muted">${esc(auditTime(l))} · ${esc(auditActor(l))}</div><div style="margin-top:7px;font-size:13px">${esc(auditSummary(l))}</div><details style="margin-top:9px"><summary class="muted" style="cursor:pointer">${summary}</summary><div class="tablewrap" style="margin-top:12px">${body}</div></details></div>`;
 }).join(''):(cloudAuditReady&&repairAuditReady?'<div class="empty">目前沒有雲端財產或維修異動紀錄。</div>':'<div class="empty">讀取中…</div>'))+'</div>';
}

 const a=assets.find(x=>x.id===id)||{};
 for(const [key,selected] of [['deviceType',a.deviceType||''],['model',a.model||'']]){
  const old=f.elements[key];if(!old)return;
  const sel=document.createElement('select');sel.name=key;sel.required=true;
  sel.innerHTML=key==='deviceType'?repairOptions(catalogPairs().keys(),selected):repairOptions(catalogPairs().get(selected&&key==='model'?a.deviceType:'')||[],selected);
  if(key==='deviceType')sel.onchange=assetModelChanged;sel.onfocus=()=>{if(key==='deviceType'){const v=sel.value;sel.innerHTML=repairOptions(catalogPairs().keys(),v)}else{const v=sel.value;sel.innerHTML=repairOptions(catalogPairs().get(f.elements.deviceType.value)||[],v)}};
  old.replaceWith(sel);
 }

 }

async function cloudCommit(action,asset,before){
 if(!window.accessGranted||!cloudAssetsReady||!window.cloudWrite){alert('雲端尚未準備完成，請稍後再試');return false}
 if(!canModify()){alert('沒有修改權限');return false}
 if(cloudBusy)return false;
 if(before && action==='修改財產' && JSON.stringify(Object.fromEntries(Object.entries(asset).sort(([a],[b])=>a.localeCompare(b))))===JSON.stringify(Object.fromEntries(Object.entries(before).sort(([a],[b])=>a.localeCompare(b))))){closeModal();return true}
 cloudBusy=true;
 try{await window.cloudWrite(action,asset,before);closeModal();return true}
 catch(e){console.error('財產儲存失敗',e);alert('雲端儲存失敗：'+(e.message||e));return false}
 finally{cloudBusy=false}
}
saveAsset=async function(e,id,type){
 e.preventDefault();let old=assets.find(x=>x.id===id),before=old?{...old}:null;
 if(id&&!old){alert('找不到原始財產，請重新整理');return}
 const a=old?{...old}:{id:crypto.randomUUID(),type,lastInventory:''};
 new FormData(e.target).forEach((v,k)=>a[k]=String(v));
 if(!window.repairAssetsReady?.()){alert('請等待 Client 與 Server 設備清單載入完成');return}if(!a.deviceType||!a.model||!catalogPairs().get(a.deviceType)?.has(a.model)){alert('請選擇現有或已核准的設備類型及型號');return}
 await cloudCommit(old?'修改財產':'新增財產',a,before)
};
inventory=async function(id){
 let a=assets.find(x=>x.id===id);if(!a||!confirm('確認更新此筆財產的盤點日期？'))return;
 let b={...a};await cloudCommit('更新盤點',{...a,lastInventory:new Date().toLocaleDateString('sv-SE')},b)
};
transfer=async function(id){
 let a=assets.find(x=>x.id===id),target=$('target')?.value;
 if(!a||!target)return;
 if(!confirm(`確定將財產移至「${target}」？`))return;
 await cloudCommit('財產移撥',{...a,team:target},{...a})
};

 async function secondaryWrite(profile,mainUid,operation){
  await requireOwnerSecondary();
  const email=String(profile.email||'').trim().toLowerCase();
  if(!email)throw new Error('主專案授權缺少 Email');
  const results=[];
  for(const [label,targetDb] of [['Client',clientDb],['Server',serverDb]]){
   try{
    // When revoking, resolve by mainUid from Owner-readable admins rather than
    // requiring a still-present identity claim. Never use an untrusted UID.
    let uid;
    if(operation==='revoke'){
     const matches=await getDocs(query(collection(targetDb,'admins'),where('mainUid','==',mainUid)));
     if(matches.size>1)throw new Error('找到重複授權，需人工檢查');

     await deleteDoc(doc(targetDb,'admins',uid));

     await setDoc(doc(targetDb,'admins',uid),{mainUid,email,role:profile.role,active:profile.active===true,displayName:profile.displayName||'',syncedAt:new Date().toISOString()});
     const verified=await getDoc(doc(targetDb,'admins',uid));
     if(!verified.exists()||verified.data().mainUid!==mainUid||verified.data().email!==email||verified.data().role!==profile.role||verified.data().active!==(profile.active===true))throw new Error('授權寫入後核對不一致');
    }
    results.push(label+'：成功');
   }catch(e){results.push(label+'：失敗（'+e.message+'）')}
  }
  return results;
 }

 let secondaryTestRunning=false;
 window.testSecondaryFirestore=async()=>{
  if(secondaryTestRunning)return;
  secondaryTestRunning=true;
  if(!window.accessGranted||window.currentRole!=='owner')return alert('請先以主專案 Owner 登入');
  if(!window.crossProjectAuthResult||!clientAuth.currentUser||!serverAuth.currentUser)return alert('請先點選「驗證三個專案登入」');
  const out=document.getElementById('secondaryFirestoreStatus');
  const log=msg=>{if(out)out.textContent+=(out.textContent?'\n':'')+msg};
  if(out)out.textContent='';
  const targets=[['Client',clientDb,clientAuth],['Server',serverDb,serverAuth]];
  for(const [name,targetDb,targetAuth] of targets){
   const testRef=doc(targetDb,'assets','v043_connection_test');
   let unsub=null;
   let created=false;
   try{
    if(!targetAuth.currentUser)throw new Error('登入狀態已失效');
    // 僅使用單一固定測試文件；測試完成後立即刪除。
    const old=await getDoc(testRef);
    if(old.exists()&&!old.data()?.v043ConnectionTest)throw new Error('測試文件 ID 已被正式資料使用，停止以避免覆寫');
    const nonce=Date.now()+'-'+Math.random().toString(36).slice(2);
    await setDoc(testRef,{type:name.toLowerCase(),v041ConnectionTest:true,nonce,phase:'created',createdAt:new Date().toISOString()});
    created=true;
    const read=await getDoc(testRef);
    if(!read.exists()||read.data().nonce!==nonce)throw new Error('寫入後讀取驗證不一致');
    let resolveSync,rejectSync;
    const synced=new Promise((resolve,reject)=>{resolveSync=resolve;rejectSync=reject});
    unsub=onSnapshot(testRef,{includeMetadataChanges:true},snap=>{
     if(snap.exists()&&snap.data().nonce===nonce&&snap.data().phase==='updated'&&!snap.metadata.hasPendingWrites)resolveSync();
    },rejectSync);
    await updateDoc(testRef,{phase:'updated'});
    // 即時監聽沒有成功時不應無限等待；在完成更新後讀取一次確認資料仍存在。
    const updated=await getDoc(testRef);
    if(updated.data()?.phase!=='updated')throw new Error('更新後讀取驗證失敗');
    await Promise.race([synced,new Promise((_,reject)=>setTimeout(()=>reject(new Error('即時監聽逾時（15 秒）')),15000))]);
    log(name+'：登入、寫入、讀取、更新、即時同步均成功。');
   }catch(e){log(name+'：驗證失敗：'+e.message)}
   finally{
    if(unsub)unsub();
    if(created){try{await deleteDoc(testRef);log(name+'：測試文件已刪除。')}catch(e){log(name+'：警告！測試文件刪除失敗，請至 assets 集合手動刪除 v042_connection_test。原因：'+e.message)}}
   }
  }
  secondaryTestRunning=false;
 };

    const p=JSON.parse(await files[i].text()),type=i===0?'client':'server';

 window.executeV044Import=async()=>{
  if(v044ImportRunning)return;
  if(!window.accessGranted||window.currentRole!=='owner'||!window.crossProjectAuthResult||!clientAuth.currentUser||!serverAuth.currentUser)return alert('請先完成 Owner 與三個專案登入驗證');

  const plan=v044ImportFiles;
  if(!confirm('確定將 Client '+plan[0].documents.length+' 筆及 Server '+plan[1].documents.length+' 筆匯入兩個新 Firebase 專案？原始資料不會刪除。請確保目前沒有其他人修改舊系統。'))return;
  v044ImportRunning=true;
  let log='';
  const report=t=>{log+=(log?'\n':'')+t;v044Status(log)};
  try{
   // 匯入前先檢查目的集合筆數，避免意外混合新舊資料。
   const targets=[[clientDb,plan[0]],[serverDb,plan[1]]];
   for(const [targetDb,p] of targets){
    const count=await getCountFromServer(collection(targetDb,'assets'));
    if(count.data().count!==0)throw new Error(p.type+'：目的資料庫 assets 已有 '+count.data().count+' 筆資料，為避免重複匯入，已停止。請先核對。');
   }
   for(const [targetDb,p] of targets){
    let written=0;

 function v056SameRepair(stored,cached){

   if(Array.isArray(value))return value.map(normalize);

 function startRepairCatalog(u){if(stopRepairCatalog)stopRepairCatalog();stopRepairCatalog=onSnapshot(collection(db,'repairCatalog'),snap=>{if(auth.currentUser?.uid!==u.uid)return;repairCatalog=snap.docs.map(d=>({id:d.id,...d.data()}))},err=>console.warn('設備核准名單讀取失敗',err));if(stopRepairRequests)stopRepairRequests();if(window.currentRole==='owner')stopRepairRequests=onSnapshot(query(collection(db,'repairCatalogRequests'),where('status','==','pending')),snap=>{if(auth.currentUser?.uid!==u.uid)return;repairRequests=snap.docs.map(d=>({id:d.id,...d.data()}));if(page==='admin')render()},err=>console.warn('設備審核申請讀取失敗',err))}
 window.cloudSaveRepair=async(f,id='')=>{
  const u=auth.currentUser;
  if(!u||!window.accessGranted||!canModify())throw new Error('僅 Owner / Editor 可以新增或修改維修紀錄');
  const previous=id?repairs.find(x=>x.id===id):null;
  if(id&&!previous)throw new Error('維修紀錄不存在');
  if(id){const fresh=await getDoc(doc(db,'repairs',id));if(!fresh.exists())throw new Error('維修紀錄已被刪除，請重新整理');if(!v056SameRepair(fresh.data(),previous))throw new Error('維修紀錄已由其他人更新，請重新開啟後修改')}
  const ref=id?doc(db,'repairs',id):doc(collection(db,'repairs'));
  const timestamp=new Date().toISOString();
  const record={...f,id:ref.id,assetId:f.assetId||'',updatedAt:timestamp,updatedBy:u.uid,...(!previous?{createdAt:timestamp,createdBy:u.uid,createdByEmail:u.email||'',createdByName:adminProfiles[u.uid]?.displayName||''}:{createdAt:previous.createdAt,createdBy:previous.createdBy,createdByEmail:previous.createdByEmail||'',createdByName:previous.createdByName||''})};
  const batch=writeBatch(db);
  batch.set(ref,record);
  batch.set(doc(collection(db,'repairAudit')),{repairId:ref.id,assetId:record.assetId,action:previous?'修改維修紀錄':'新增維修紀錄',before:previous||null,after:record,actorUid:u.uid,actorEmail:u.email||'',actorDisplayName:adminProfiles[u.uid]?.displayName||'',timestamp});
  await batch.commit();
 };
 window.cloudDeleteRepair=async(id)=>{
  const u=auth.currentUser;
  if(!u||!window.accessGranted||window.currentRole!=='owner')throw new Error('只有 Owner 可以刪除');
  const previous=repairs.find(x=>x.id===id);if(!previous)throw new Error('維修紀錄不存在');
  const fresh=await getDoc(doc(db,'repairs',id));if(!fresh.exists())throw new Error('維修紀錄已被刪除');
  const batch=writeBatch(db);
  batch.delete(doc(db,'repairs',id));
  batch.set(doc(collection(db,'repairAudit')),{repairId:id,assetId:previous.assetId||'',action:'刪除維修紀錄',before:previous,after:null,actorUid:u.uid,actorEmail:u.email||'',actorDisplayName:adminProfiles[u.uid]?.displayName||'',timestamp:new Date().toISOString()});
  await batch.commit();
 };
 // V0.53: repairs and audit histories live only in the main Firestore.
 // The two secondary projects contain assets only.
 function startCloudRepairs(u){
  startRepairCatalog(u);
  if(stopRepairs)return;
  stopRepairs=onSnapshot(collection(db,'repairs'),snap=>{
   if(auth.currentUser?.uid!==u.uid)return;
   repairs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));

  },err=>console.error('主專案維修紀錄讀取失敗',err));
 }
 function startRepairAudit(u){
  if(stopRepairAudit)return;
  stopRepairAudit=onSnapshot(query(collection(db,'repairAudit'),orderBy('timestamp','desc'),limit(100)),snap=>{
   if(auth.currentUser?.uid!==u.uid)return;
   repairAuditEntries=snap.docs.map(d=>({auditId:d.id,...d.data()}));repairAuditReady=true;
   if(['dashboard','history'].includes(page))render();
  },err=>{console.error('主專案維修歷程讀取失敗',err);repairAuditReady=false;if(page==='history')render()});
 }
 // V0.35: 各集合依實際頁面需求啟動；登入只驗證權限。
 let activeCloudUser=null;
 window.dashboardCloudEnabled=false;
 function startAssetsOnDemand(u,mode='all'){
  // V0.37：Client/Server 各自最多建立一個即時監聽，登入期間持續重用。
  // 跨類型頁面直接合併兩份已訂閱資料，不再額外查詢完整 assets 集合。
  try{v047EnsureOwner();window.assetLoadError=''}catch(e){cloudAssetsReady=false;assets=[];window.assetLoadError=e.message;const el=document.getElementById('v047RouteStatus');if(el)el.textContent=e.message;if(page==='assets')render();return}
  assetDisplayMode=mode;
  const types=mode==='all'?['client','server']:[mode];
  for(const type of types){
   if(assetListeners[type])continue;
   assetLoaded[type]=false;
   assetListeners[type]=onSnapshot(collection(v047AssetDb(type),'assets'),snap=>{
    if(auth.currentUser?.uid!==u.uid)return;
    assetCache[type]=snap.docs.map(d=>({id:d.id,...d.data()}));
    assetLoaded[type]=true;
    refreshAssetView();
   },err=>{
    if(auth.currentUser?.uid!==u.uid)return;
    console.error('Firestore '+type+' 財產同步失敗',err);
    window.assetLoadError=type+' 財產同步失敗：'+err.message;
    assetLoaded[type]=false;
    if(['assets','repairOverview','admin','import'].includes(page))refreshAssetView();
   });
  }
  refreshAssetView();
 }
 function refreshAssetView(){
  const mode=assetDisplayMode;
  const ready=mode==='all'?(assetLoaded.client&&assetLoaded.server):!!assetLoaded[mode];
  cloudAssetsReady=ready;
  if(ready)window.assetLoadError='';
  assets=mode==='all'?[...assetCache.client,...assetCache.server]:(assetLoaded[mode]?assetCache[mode].slice():[]);
  if(['assets','repairOverview','dashboard','admin','import'].includes(page))render();
 }

 function startDashboardAuditPreview(u){
  if(previewAuditStops.length||stopAudit||stopRepairAudit)return;
  for(const name of ['assetAudit','repairAudit']){
   const unsub=onSnapshot(query(collection(db,name),orderBy('timestamp','desc'),limit(5)),snap=>{
    if(auth.currentUser?.uid!==u.uid)return;
    if(name==='assetAudit'){cloudAudit=snap.docs.map(d=>({auditId:d.id,...d.data()}));cloudAuditReady=true}
    else{repairAuditEntries=snap.docs.map(d=>({auditId:d.id,...d.data()}));repairAuditReady=true}
    if(page==='dashboard')render();
   },err=>console.error('主專案近期歷程讀取失敗',name,err));
   previewAuditStops.push(unsub);
  }
 }
 function startAuditsOnDemand(u){
  previewAuditStops.forEach(fn=>fn());previewAuditStops=[];
  startRepairAudit(u);
  if(stopAudit)return;
  stopAudit=onSnapshot(query(collection(db,'assetAudit'),orderBy('timestamp','desc'),limit(100)),snap=>{
   if(auth.currentUser?.uid!==u.uid)return;
   cloudAudit=snap.docs.map(d=>({auditId:d.id,...d.data()}));cloudAuditReady=true;
   if(['history','dashboard'].includes(page))render();
  },err=>{console.error('主專案財產歷程讀取失敗',err);cloudAuditReady=false;if(page==='history')render()});
 }
 window.repairAssetsReady=()=>assetLoaded.client&&assetLoaded.server;
  window.ensurePageCloudData=(p)=>{
  const u=activeCloudUser;
  if(!u||auth.currentUser?.uid!==u.uid||!window.accessGranted)return;
  if(p==='supplies')startSuppliesOnDemand(u);if(p==='assets')startAssetsOnDemand(u,tab);
  else if(p==='repairs'||p==='repairOverview'||p==='import'||(p==='dashboard'&&window.dashboardCloudEnabled))startAssetsOnDemand(u,'all');
  if(p==='assets'||p==='repairs'||p==='repairOverview'||(p==='dashboard'&&window.dashboardCloudEnabled)){
   startCloudRepairs(u);
  }
  if(p==='history'||(p==='dashboard'&&window.dashboardCloudEnabled))startAuditsOnDemand(u);
  else if(p==='dashboard')startDashboardAuditPreview(u);
 };
 window.loadDashboardCloud=()=>{
  window.dashboardCloudEnabled=true;
  render();
  window.ensurePageCloudData('dashboard');
 };
 window.startCloudAssets=async(db,u)=>{
  activeCloudUser=u;
  window.ensurePageCloudData(page);
 };

 // V0.58: use the homepage Google popup credential to sign in secondary projects.
 let v058Linking=false;
 async function v058LinkSecondary(result){
  if(v058Linking||!result?.user?.email)return;
  const credential=GoogleAuthProvider.credentialFromResult(result);
  if(!credential||(!credential.accessToken&&!credential.idToken))return;
  v058Linking=true;
  try{
   const primary=result.user;
   const [c,v]=await Promise.all([signInWithCredential(clientAuth,credential),signInWithCredential(serverAuth,credential)]);
   if(auth.currentUser?.uid!==primary.uid)return;
   const email=primary.email.toLowerCase();
   if(String(c.user.email||'').toLowerCase()!==email||String(v.user.email||'').toLowerCase()!==email)throw new Error('三專案 Google 帳號不一致');
   await registerSecondaryIdentities();
   window.crossProjectAuthResult={main:{projectId:'taoyuancyd-asset-mgmt',uid:primary.uid,email:primary.email},client:{projectId:'taoyuan-asset-client',uid:c.user.uid,email:c.user.email},server:{projectId:'taoyuan-asset-server',uid:v.user.uid,email:v.user.email}};
   window.assetLoadError='';
   if(window.accessGranted){window.ensurePageCloudData?.(page);render()}
   // Secondary identity registration enables Owner-managed provisioning on Spark.
   // Spark identity registration occurs before main authorization checks.
   if(window.accessGranted)window.ensurePageCloudData?.(page);
  }catch(e){console.warn('三專案自動登入未完成',e)}
  finally{v058Linking=false}
 }
 window.signInUser=async()=>{
  try{const result=await signInWithPopup(auth,provider);await v058LinkSecondary(result)}catch(e){
   if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){try{await signInWithRedirect(auth,provider)}catch(r){alert('登入失敗：'+r.message)}}
   else if(e.code!=='auth/popup-closed-by-user')alert('登入失敗：'+e.message)
  }
 };
 window.signOutUser=async()=>{window.stopV046Preview?.();window.accessGranted=false;window.stopCloudAssets?.();window.crossProjectAuthResult=null;try{await Promise.all([signOut(clientAuth),signOut(serverAuth),signOut(auth)])}catch(e){alert('登出失敗：'+e.message)}};
 onAuthStateChanged(auth,async user=>{
  window.stopV046Preview?.();
  window.accessGranted=false;window.stopCloudAssets?.();
  document.getElementById('logoutBtn').style.display=user?'inline-block':'none';
  document.getElementById('authUser').textContent=user?(user.email||'已登入'):'尚未登入';
  if(!user){authReady();return}
  showAuthScreen('正在核對授權名單','Google 帳號已登入，正在檢查 Firestore admins 授權資料。');
  try{
   const snap=await getDoc(doc(db,'admins',user.uid));
   if(auth.currentUser?.uid!==user.uid)return;
   const info=snap.exists()?snap.data():null;
   if(!info||info.active!==true||!['owner','editor','viewer'].includes(info.role)){
    if(info && info.active===false){showAuthScreen('帳號已停用','目前此帳號沒有存取權限，請聯絡系統管理者。','<button class="btn" onclick="signOutUser()">切換帳號</button>');return;}
    const requestRef=doc(db,'accessRequests',user.uid);
    const showPending=r=>showAuthScreen(r?.status==='rejected'?'申請已被拒絕':'等待管理者授權',`Google 帳號：${user.email||''}。${r?.status==='rejected'?'如需再次申請，請聯絡系統管理者。':'已送出授權申請，請等待 Owner 審核；核准後請重新整理網頁。'}`,'<button class="btn" onclick="signOutUser()">切換帳號</button>');
    let req=await getDoc(requestRef);
    if(!req.exists()){
      await setDoc(requestRef,{uid:user.uid,email:user.email||'',googleName:user.displayName||'',status:'pending',requestedAt:new Date().toISOString()});
      req=await getDoc(requestRef);
    }
    showPending(req.data());
    stopOwnRequest=onSnapshot(requestRef,async snap=>{
      if(auth.currentUser?.uid!==user.uid)return;
      if(snap.exists()&&snap.data().status==='approved'){
        if(stopOwnRequest){stopOwnRequest();stopOwnRequest=null}
        // Auth listener will re-evaluate the new admins document after a page refresh.
        showAuthScreen('帳號已核准','管理者已完成授權，請按下方按鈕載入系統。','<button class="btn primary" onclick="location.reload()">進入系統</button>');
      }else if(snap.exists())showPending(snap.data());
    },err=>showAuthScreen('申請狀態讀取失敗',err.message));
    return;
   }
   window.accessGranted=true;
   window.currentRole=info.role;
   // V0.50: Firebase Auth persists independently for each app across refresh.
   // Rehydrate the three-project verification after both secondary Auth instances initialize.
   if(['owner','editor','viewer'].includes(info.role)){
    try{
     await Promise.all([clientAuth.authStateReady(),serverAuth.authStateReady()]);
     if(auth.currentUser?.uid!==user.uid)return;
     const c=clientAuth.currentUser,v=serverAuth.currentUser;
     const email=String(user.email||'').toLowerCase();
     if(c&&v&&email&&String(c.email||'').toLowerCase()===email&&String(v.email||'').toLowerCase()===email){
      window.crossProjectAuthResult={main:{projectId:'taoyuancyd-asset-mgmt',uid:user.uid,email:user.email},client:{projectId:'taoyuan-asset-client',uid:c.uid,email:c.email},server:{projectId:'taoyuan-asset-server',uid:v.uid,email:v.email}};
     }else window.crossProjectAuthResult=null;
    }catch(e){console.warn('跨專案登入恢復失敗',e);window.crossProjectAuthResult=null}
   }else window.crossProjectAuthResult=null;
   document.querySelector('.sidefoot').innerHTML='已通過 Firebase 授權核對<br>財產、維修與財產異動：Firestore<br>交接、備品：本機展示資料';
   // 授權完成即可顯示輕量首頁，不強制讀取財產。
   await window.startCloudAssets(db,user);
   if(auth.currentUser?.uid!==user.uid)return;
   render();
   startAdminProfiles(user,info);
   startRepairDirectory(user);
   if(info.role==='owner')startRequests(user);
  }catch(e){showAuthScreen('無法確認帳號授權','Firestore 讀取授權資料失敗。請確認已啟用 Firestore、部署安全規則，並檢查網路連線。錯誤：'+e.message,'<button class="btn" onclick="signOutUser()">登出</button>')}
 },error=>showAuthScreen('驗證發生錯誤',error.message));
 getRedirectResult(auth).then(result=>{if(result)v058LinkSecondary(result)}).catch(e=>console.warn('重新導向登入失敗',e));
}catch(e){showAuthScreen('Firebase 初始化失敗','請確認網路、Firebase SDK 與專案設定。錯誤：'+e.message)}
</script></body></html>
