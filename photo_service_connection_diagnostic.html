<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片服務連線診斷（不寫入資料）</title><style>body{font:16px system-ui,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;color:#233}iframe{width:100%;height:420px;border:2px solid #9ab;border-radius:8px}pre{white-space:pre-wrap;background:#eef2f7;padding:12px;border-radius:8px}button{padding:10px 16px}small{color:#555}</style><h2>照片服務連線診斷</h2><p>此頁不登入 Firebase、不新增交接、不上傳照片，也不修改 Firestore。請觀察下方 Apps Script 頁面顯示內容。</p><p><button onclick="start()">重新載入照片服務</button> <button onclick="navigator.clipboard.writeText(document.getElementById('log').textContent)">複製診斷紀錄</button></p><p id="status">準備載入</p><div id="frame"></div><h3>訊息紀錄</h3><pre id="log"></pre><small>如果 iframe 顯示登入頁、錯誤頁或授權要求，代表 /exec 尚未提供可嵌入的照片服務頁面。</small><script>
const url="https://script.google.com/macros/s/AKfycbyutGo96mBbVpp_EsMHuf1f80Pz58yoS5CvwBAee4Q5-CmeafbpxefJDoE6A-SLHh7LuQ/exec";const log=document.getElementById('log'),status=document.getElementById('status');function note(t){log.textContent+='['+new Date().toLocaleTimeString()+'] '+t+'\n'}let timer;function start(){clearTimeout(timer);document.getElementById('frame').replaceChildren();log.textContent='';status.textContent='等待 READY 訊息';const f=document.createElement('iframe');f.title='Apps Script 實際網頁';f.src=url;f.addEventListener('load',()=>note('iframe load：不代表 GAS 腳本執行'));f.addEventListener('error',()=>note('iframe error'));document.getElementById('frame').append(f);note('已建立可見 iframe：'+url);timer=setTimeout(()=>{note('30 秒仍未確認 READY');status.textContent='未收到 READY：請查看 iframe 實際顯示內容'},30000)}
window.addEventListener('message',e=>{note('收到訊息：origin='+e.origin+' kind='+String(e.data?.kind||'(無)'));if(e.data?.kind==='CYD86_REAL_READY'){clearTimeout(timer);status.textContent='收到 CYD86_REAL_READY，通訊正常';note('READY 成功')}});start();
</script></html>
