<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYD V0.86 Image upload diagnostic</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:780px;margin:40px auto;padding:0 18px}button{padding:10px 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:16px;border-radius:8px}iframe{width:100%;height:90px;border:1px solid #ddd}input{width:100%;box-sizing:border-box;padding:9px}</style></head><body>
<h1>V0.86 照片與交接紀錄綁定測試</h1><p>僅允許 Owner。從清單選擇一筆測試交接，不必查詢或填寫 Firestore ID。圖片暫存於 Drive，測試後請按刪除。此測試不寫入 Firestore。</p>
<p><label>Apps Script 正式 /exec 網址<input id="url" value="https://script.google.com/macros/s/AKfycbyutGo96mBbVpp_EsMHuf1f80Pz58yoS5CvwBAee4Q5-CmeafbpxefJDoE6A-SLHh7LuQ/exec"></label></p>
<p><button id="load" type="button">登入並載入交接清單</button></p><p><label>選擇測試交接紀錄<select id="handoverId" style="display:block;width:100%;padding:10px"><option value="">請先載入清單</option></select></label></p><p><small>僅列出最近 20 筆未刪除的交接紀錄。請選擇測試資料，不要使用正式財產資料。</small></p><p><label>測試圖片（成功上傳後需按「刪除測試圖片」清除）<input type="file" id="photo" accept="image/jpeg,image/png,image/heic,image/webp"></label></p><p><button id="test">上傳並綁定測試圖片</button> <button id="read" type="button">讀回測試圖片</button> <button id="delete" type="button">刪除測試圖片</button></p><p><label>本次測試檔案 ID<input id="fileId" readonly></label></p><img id="preview" alt="讀回的測試圖片" style="max-width:100%;max-height:320px;display:none"><pre id="status">等待測試。請先部署 photo_service_v086_bound_pilot.gs 新版本。</pre><h3>訊息診斷紀錄（不顯示登入憑證）</h3><pre id="log">尚無紀錄</pre><div id="frame"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import {getFirestore,collection,query,orderBy,limit,getDocs} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyBngp2V_mKmPmLrgjAOHrCbL0EMfa39dx0',authDomain:'taoyuancyd-asset-mgmt.firebaseapp.com',projectId:'taoyuancyd-asset-mgmt',appId:'1:144237236073:web:e2a7230e8a68357e92f7f8'},'cyd-v086-auth-test');
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let nonce='',pendingToken='',pendingImage=null,active=false,ready=false,child=null,timer=null,operation='upload';const logs=[];function trace(msg){logs.push(new Date().toLocaleTimeString()+' '+msg);$('log').textContent=logs.slice(-30).join('\n')}
function status(s){$('status').textContent=s}
$('load').onclick=async()=>{try{status('正在登入並載入最近 20 筆交接…');await signInWithPopup(auth,new GoogleAuthProvider());const snap=await getDocs(query(collection(db,'handovers'),orderBy('latestAt','desc'),limit(20)));const select=$('handoverId');select.replaceChildren(new Option('請選擇測試交接',''));let count=0;for(const d of snap.docs){const x=d.data();if(x.status==='已刪除')continue;const label=[x.title||x.subject||x.content||'交接紀錄',x.date||x.createdAt||''].join('｜').slice(0,100);select.add(new Option(label,d.id));count++}status(count?'已載入 '+count+' 筆交接紀錄，請選擇一筆測試資料':'沒有可用的交接紀錄');}catch(e){status('載入交接清單失敗：'+(e.code||e.message||e))}};
$('read').onclick=()=>run('read');$('delete').onclick=()=>run('delete');$('test').onclick=()=>run('upload');
async function run(op){
 operation=op;
 if(location.origin!=='https://jack9664-app.github.io'){status('請使用正式 GitHub Pages 網址');return}
 const url=$('url').value.trim();
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){status('請輸入有效 Apps Script /exec 網址');return}
 try{
   const h=$('handoverId').value.trim();if(!/^[A-Za-z0-9_-]{5,150}$/.test(h)){status('請填寫有效的測試交接／進度文件 ID');return}
   if(op!=='upload'&&!$('fileId').value.trim()){status('請先成功上傳測試圖片');return}
   const file=$('photo').files[0];if(op==='upload'&&!file){status('請先選擇一張測試圖片');return}
   if(op==='upload'){status('正在壓縮圖片…');
   const bitmap=await createImageBitmap(file);
   let maxSide=1920,quality=.85,blob=null;
   for(let i=0;i<10;i++){
     const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
     const canvas=document.createElement('canvas');
     canvas.width=Math.max(1,Math.round(bitmap.width*scale));
     canvas.height=Math.max(1,Math.round(bitmap.height*scale));
     canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
     blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
     if(!blob)throw Error('瀏覽器無法將圖片轉成 JPEG');
     if(blob.size<=8000000)break;
     if(quality>.62)quality-=.08;else maxSide=Math.round(maxSide*.8);
   }
   bitmap.close();
   if(!blob||blob.size>8000000)throw Error('壓縮後仍超過 8MB');
   const base64=await new Promise((resolve,reject)=>{
     const reader=new FileReader();
     reader.onload=()=>resolve(String(reader.result).split(',')[1]);
     reader.onerror=()=>reject(Error('讀取圖片失敗'));
     reader.readAsDataURL(blob);
   });
   pendingImage={mime:'image/jpeg',base64};
   trace('原始 '+(file.size/1048576).toFixed(2)+' MB，壓縮後 '+(blob.size/1048576).toFixed(2)+' MB');}
   status('正在登入 Firebase…');
   const result=await signInWithPopup(auth,new GoogleAuthProvider());
   pendingToken=await result.user.getIdToken(true);
   if(typeof pendingToken!=='string'||pendingToken.length<100)throw Error('Firebase 未取得有效登入憑證');
   clearTimeout(timer);active=true;ready=false;child=null;logs.length=0;trace('Firebase 登入成功，準備載入 iframe');
   nonce=Array.from(crypto.getRandomValues(new Uint8Array(18)),x=>x.toString(16).padStart(2,'0')).join('');
   const f=document.createElement('iframe');f.src=url;f.title='Apps Script Firebase auth diagnostic';f.addEventListener('load',()=>trace('iframe load 事件（不代表後端已連線）'));$('frame').replaceChildren(f);
   status('Firebase 登入成功，等待 Apps Script…');
   timer=setTimeout(()=>{active=false;pendingToken='';pendingImage=null;trace('90 秒逾時');status('逾時：請查看下方訊息診斷紀錄')},90000);
 }catch(e){pendingToken='';pendingImage=null;status('測試失敗：'+(e.code||e.message||String(e)))}
}
window.addEventListener('message',ev=>{
 if(!active||!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(ev.origin))return;
 if(!ev.data||typeof ev.data!=='object')return;
 if(ev.data.kind==='CYD86_BOUND_READY'&&!ready){
   if(!pendingToken||(operation==='upload'&&!pendingImage)){trace('缺少登入憑證或上傳圖片，停止傳送');active=false;status('資料準備不完整，請重新測試');return}
   ready=true;child=ev.source;trace('收到 BOUND_READY，開始向已核對的 Google 來源傳送請求');
   child.postMessage({kind:'CYD86_BOUND_REQUEST',nonce,idToken:pendingToken,image:pendingImage,operation,target:{handoverId:$('handoverId').value.trim(),kind:'handover',progressId:''},fileId:$('fileId').value.trim()},ev.origin);
   pendingToken='';pendingImage=null;status('Apps Script 已連線，正在執行 '+operation+' 操作…');
 }else if(ev.data.kind==='CYD86_BOUND_RESULT'&&ev.source===child&&ev.data.nonce===nonce){
   clearTimeout(timer);active=false;trace('收到 BOUND_RESULT');const r=ev.data.result;if(r?.ok&&r.operation==='upload')$('fileId').value=r.fileId;if(r?.ok&&r.operation==='read'&&r.base64){$('preview').src='data:image/jpeg;base64,'+r.base64;$('preview').style.display='block';status(JSON.stringify({ok:true,operation:'read',bytes:r.bytes,firestoreModified:false},null,2))}else{status(JSON.stringify(r,null,2))}if(r?.ok&&r.operation==='delete'){$('fileId').value='';$('preview').removeAttribute('src');$('preview').style.display='none'}
 }
});
</script></body></html>
