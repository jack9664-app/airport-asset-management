<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaoyuanCYD V0.86 Bridge v2</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px}button{padding:10px 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:16px;border-radius:8px}iframe{width:100%;height:130px;border:1px solid #ddd}input{width:100%;box-sizing:border-box;padding:9px}</style></head><body>
<h1>V0.86 GitHub Pages → Apps Script 通訊測試 v2</h1>
<p>僅測試網頁與後端通訊及 Drive 資料夾存取；不會傳送 Firebase 憑證、上傳或刪除照片。</p>
<label>Apps Script /dev 測試網址<input id="url" value="https://script.google.com/macros/s/AKfycbweknUPEy2VB5Jfo7MqJAJuSakuxFH456fGdxZ7LFCV/dev"></label>
<p><button id="start">開始測試</button></p><pre id="status">等待測試</pre><div id="frame"></div>
<script>
const $=id=>document.getElementById(id);
let nonce='',active=false,timer=null,child=null;
$('start').onclick=()=>{
  if(location.origin!=='https://jack9664-app.github.io'){$('status').textContent='請使用指定的 GitHub Pages 網址測試';return}
  const url=$('url').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/(?:u\/\d+\/)?s\/[\w-]+\/dev(?:\?.*)?$/.test(url)){$('status').textContent='網址必須是 Apps Script /dev 測試網址';return}
  clearTimeout(timer);active=true;child=null;
  nonce=Array.from(crypto.getRandomValues(new Uint8Array(18)),x=>x.toString(16).padStart(2,'0')).join('');
  const f=document.createElement('iframe');f.src=url;f.title='Apps Script diagnostic v2';
  $('frame').replaceChildren(f);$('status').textContent='等待 Apps Script 的內層 HTMLService iframe 回應…';
  timer=setTimeout(()=>{active=false;$('status').textContent='逾時：未收到回應。請檢查 Google 帳號登入或瀏覽器嵌入限制。'},30000);
};
window.addEventListener('message',ev=>{
  if(!active || !/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(ev.origin))return;
  if(!ev.data || typeof ev.data!=='object')return;
  if(ev.data.kind==='CYD_V086_READY_V2' && !child){
    child=ev.source;
    $('status').textContent='已收到內層網頁訊號，正在呼叫後端…';
    child.postMessage({kind:'CYD_V086_PING_V2',nonce},ev.origin);
  } else if(ev.data.kind==='CYD_V086_RESULT_V2' && ev.source===child && ev.data.nonce===nonce){
    clearTimeout(timer);active=false;$('status').textContent=JSON.stringify(ev.data.result,null,2);
  }
});
</script></body></html>
