<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYD V0.86 Image upload diagnostic</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:780px;margin:40px auto;padding:0 18px}button{padding:10px 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:16px;border-radius:8px}iframe{width:100%;height:90px;border:1px solid #ddd}input{width:100%;box-sizing:border-box;padding:9px}</style></head><body>
<h1>V0.86 Google Drive JPEG 圖片隔離測試</h1><p>僅允許 Owner。後端會建立一個隨機文字測試檔、讀回核對後移至垃圾桶；不會操作照片、交接紀錄或 Firestore 資料。</p>
<p><label>Apps Script 正式 /exec 網址<input id="url" value="https://script.google.com/macros/s/AKfycbyutGo96mBbVpp_EsMHuf1f80Pz58yoS5CvwBAee4Q5-CmeafbpxefJDoE6A-SLHh7LuQ/exec"></label></p>
<p><label>測試圖片（僅在測試期間傳送至 Apps Script，測試後移至垃圾桶）<input type="file" id="photo" accept="image/jpeg,image/png,image/heic,image/webp"></label></p><p><button id="test">以 Owner 身分測試 JPEG 上傳／讀回／清除</button></p><pre id="status">等待測試。請先部署 photo_service_v086_image_test.gs 新版本。</pre><h3>訊息診斷紀錄（不顯示登入憑證）</h3><pre id="log">尚無紀錄</pre><div id="frame"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyBngp2V_mKmPmLrgjAOHrCbL0EMfa39dx0',authDomain:'taoyuancyd-asset-mgmt.firebaseapp.com',projectId:'taoyuancyd-asset-mgmt',appId:'1:144237236073:web:e2a7230e8a68357e92f7f8'},'cyd-v086-auth-test');
const auth=getAuth(app),$=id=>document.getElementById(id);
let nonce='',pendingToken='',pendingImage=null,active=false,ready=false,child=null,timer=null;const logs=[];function trace(msg){logs.push(new Date().toLocaleTimeString()+' '+msg);$('log').textContent=logs.slice(-30).join('\n')}
function status(s){$('status').textContent=s}
$('test').onclick=async()=>{
 if(location.origin!=='https://jack9664-app.github.io'){status('請使用正式 GitHub Pages 網址');return}
 const url=$('url').value.trim();
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){status('請輸入有效 Apps Script /exec 網址');return}
 try{
   status('正在登入 Firebase…');
   const result=await signInWithPopup(auth,new GoogleAuthProvider());
   pendingToken=await result.user.getIdToken(true);
   clearTimeout(timer);active=true;ready=false;child=null;logs.length=0;trace('Firebase 登入成功，準備載入 iframe');
   nonce=Array.from(crypto.getRandomValues(new Uint8Array(18)),x=>x.toString(16).padStart(2,'0')).join('');
   const f=document.createElement('iframe');f.src=url;f.title='Apps Script Firebase auth diagnostic';f.addEventListener('load',()=>trace('iframe load 事件（不代表後端已連線）'));$('frame').replaceChildren(f);
   status('Firebase 登入成功。等待 Apps Script 橋接網頁…');
   timer=setTimeout(()=>{active=false;pendingToken='';pendingImage=null;trace('30 秒逾時');status('逾時：請查看下方訊息診斷紀錄')},30000);
 }catch(e){pendingToken='';pendingImage=null;status('Firebase 登入失敗：'+(e.code||e.message||String(e)))}
};
window.addEventListener('message',ev=>{
 if(!active||!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(ev.origin))return;
 if(!ev.data||typeof ev.data!=='object')return;
 if(ev.data.kind==='CYD86_IMAGE_READY'&&!ready){
   ready=true;child=ev.source;trace('收到 AUTH_READY，開始傳送憑證給已核對的 Google 來源');
   child.postMessage({kind:'CYD86_IMAGE_REQUEST',nonce,idToken:pendingToken,image:pendingImage},ev.origin);
   pendingToken='';pendingImage=null;status('Apps Script 已連線，正在後端驗證 Firebase 權限…');
 }else if(ev.data.kind==='CYD86_IMAGE_RESULT'&&ev.source===child&&ev.data.nonce===nonce){
   clearTimeout(timer);active=false;trace('收到 AUTH_RESULT');status(JSON.stringify(ev.data.result,null,2));
 }
});
</script></body></html>
