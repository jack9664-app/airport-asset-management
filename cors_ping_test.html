<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYD GAS CORS Ping</title><style>body{font:16px system-ui;max-width:720px;margin:30px auto;padding:15px;line-height:1.7}input{width:100%;box-sizing:border-box;padding:12px}button{padding:12px;margin:10px 5px 10px 0}pre{background:#eee;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>GAS CORS Ping（不操作任何正式資料）</h2><p>貼上獨立測試 GAS 的 /exec 網址</p><input id="url" placeholder="https://script.google.com/macros/s/.../exec"><p><button onclick="run('POST')">測試 POST 並讀取 JSON</button><button onclick="run('GET')">測試 GET 並讀取 JSON</button></p><pre id="out">尚未測試</pre><script>async function run(method){let url=document.getElementById('url').value.trim(),out=document.getElementById('out');if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec(?:\?.*)?$/.test(url)){out.textContent='請貼上 GAS /exec 網址';return}let nonce='ping-'+Date.now(),init={method,mode:'cors',redirect:'follow',cache:'no-store'};if(method==='POST'){init.headers={'Content-Type':'text/plain;charset=UTF-8'};init.body=JSON.stringify({nonce})}out.textContent='測試中...';try{let r=await fetch(url,init),d=await r.json();out.textContent=JSON.stringify({status:r.status,redirected:r.redirected,result:d,success:r.ok&&d.reply==='pong'&&d.test==='CYD_CORS_PING_V1'&&(method==='GET'||d.nonce===nonce)},null,2)}catch(e){out.textContent='測試失敗：'+String(e)+'\n請查看 Chrome Console/Network 判斷是否 CORS 或網址問題'}}</script></html>
